name: Reseed demo data

# MANUAL ONLY, and deliberately awkward to fire.
#
# `pnpm --filter api seed` TRUNCATEs the domain tables before rebuilding them, so
# this DESTROYS all demo patients, check-ins and escalations on the target box and
# recreates the seed set (Sehat Clinic (DEMO), 3 staff, 2 plan templates, the full
# EN/UZ/RU content pack, DEMO-01..06). It exists because the deploy pipeline runs
# `prisma migrate deploy` and never the seed — so content-pack changes reach the
# server's code but not its database until this is run.
#
# NEVER point this at a box with real patients on it. The production gate
# (PATIENT_ENROLMENT_ENABLED=false) is what keeps that from being possible today.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESEED to confirm this wipes and rebuilds the demo database'
        required: true
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  seed:
    name: reseed the demo database
    runs-on: ubuntu-latest

    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RESEED" ]; then
            echo "Refusing: confirmation input was not exactly RESEED."
            exit 1
          fi
          echo "Confirmed."

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run the seed
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PATH=/root/.nvm/versions/node/v24.18.0/bin:$PATH
          cd /home/django/hospital-ai

          echo "--- current commit: $(git rev-parse --short HEAD)"
          echo "--- seeding (truncates + rebuilds the demo data)"
          pnpm --filter api seed

          echo "--- restarting so nothing serves a stale cache"
          pm2 restart hospital-api --update-env
          pm2 save

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3012/v1/docs || true)
            if [ "$code" = "200" ]; then echo "api ready after ~$((i*2))s"; break; fi
            sleep 2
          done
          REMOTE

      - name: Verify the new translations are being served
        run: |
          set -e
          ru=$(curl -s --max-time 20 "https://api.hospital-ai.uz/v1/content/emergency.headline?lang=RU")
          uz=$(curl -s --max-time 20 "https://api.hospital-ai.uz/v1/content/emergency.headline?lang=UZ")
          echo "RU: $ru"
          echo "UZ: $uz"
          # The whole point of the reseed: the loud placeholder wrapper must be gone.
          if echo "$ru$uz" | grep -q "PLACEHOLDER — NOT CLINICALLY APPROVED"; then
            echo "FAILED: still serving the untranslated placeholder wrapper."
            exit 1
          fi
          echo "Verified: real UZ/RU translations are live."
